name: Build & Release MochiLedger SyncServer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Build Cudy TR3000 / OpenWrt Binaries, Ktor Server & Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install UPX for ultra-small Cudy TR3000 128M binary
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
      - name: Verify Cloudflare Worker JS syntax
        run: node --check cloudflare-worker/worker.js
      - name: Test & Cross-Compile OpenWrt Static Binaries
        working-directory: openwrt-go
        run: |
          go test -v ./...
          mkdir -p ../dist-artifacts/openwrt
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist-artifacts/openwrt/mochiledger-sync-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist-artifacts/openwrt/mochiledger-sync-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o ../dist-artifacts/openwrt/mochiledger-sync-linux-armv7 .
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o ../dist-artifacts/openwrt/mochiledger-sync-linux-mipsle .
          # Dedicated UPX-compressed ultra-compact binary for Cudy TR3000 128M (MT7981B aarch64)
          cp ../dist-artifacts/openwrt/mochiledger-sync-linux-arm64 ../dist-artifacts/openwrt/mochiledger-sync-cudy-tr3000-arm64
          upx --best --lzma ../dist-artifacts/openwrt/mochiledger-sync-cudy-tr3000-arm64
          cp mochiledger-sync.init ../dist-artifacts/openwrt/mochiledger-sync.init
          cp install-cudy-tr3000.sh ../dist-artifacts/openwrt/install-cudy-tr3000.sh
          ls -lh ../dist-artifacts/openwrt/
      - name: Run Ktor Server Tests & Build Distribution
        working-directory: ktor-server
        run: |
          chmod +x gradlew
          ./gradlew test installDist --no-daemon
      - name: Package Artifacts
        run: |
          cd ktor-server/build/install && zip -r ../../../dist-artifacts/MochiLedger-SyncServer-ktor.zip MochiLedger-SyncServer
          cd ../../..
          cp cloudflare-worker/worker.js dist-artifacts/MochiLedger-SyncServer-cloudflare-worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: mochiledger-sync-server-artifacts
          path: dist-artifacts/**/*

  publish-release:
    name: Publish GitHub Release
    needs: [ verify-and-build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mochiledger-sync-server-artifacts
          path: release-files
      - name: Prepare Release Assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          cp release-files/openwrt/mochiledger-sync-cudy-tr3000-arm64 "out/mochiledger-sync-${TAG}-cudy-tr3000-arm64"
          cp release-files/openwrt/install-cudy-tr3000.sh "out/install-cudy-tr3000.sh"
          cp release-files/openwrt/mochiledger-sync-linux-amd64 "out/mochiledger-sync-${TAG}-openwrt-amd64"
          cp release-files/openwrt/mochiledger-sync-linux-arm64 "out/mochiledger-sync-${TAG}-openwrt-arm64"
          cp release-files/openwrt/mochiledger-sync-linux-armv7 "out/mochiledger-sync-${TAG}-openwrt-armv7"
          cp release-files/openwrt/mochiledger-sync-linux-mipsle "out/mochiledger-sync-${TAG}-openwrt-mipsle"
          cp release-files/openwrt/mochiledger-sync.init "out/mochiledger-sync.init"
          cp release-files/MochiLedger-SyncServer-ktor.zip "out/MochiLedger-SyncServer-${TAG}-ktor.zip"
          cp release-files/MochiLedger-SyncServer-cloudflare-worker.js "out/MochiLedger-SyncServer-${TAG}-cloudflare-worker.js"
          ls -lh out/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MochiLedger SyncServer ${TAG}" \
            --notes "## MochiLedger SyncServer ${TAG}

          ### Cudy TR3000 (128M / MT7981B ARM64) 专属优化版
          - **超小体积单文件**：\`mochiledger-sync-${TAG}-cudy-tr3000-arm64\`（UPX LZMA 极限压缩至 ~1.8 MB，专为 128MB 小闪存优化）
          - **一键安装 + 自动放行 IPv6 防火墙脚本**：\`install-cudy-tr3000.sh\`
          - 支持双栈监听 \`[::]:8787\`（局域网 IPv4 + 外网 IPv6 直连）及可选 HTTPS 证书（\`-cert\` / \`-key\`）。

          ### 其他通用版本
          - **OpenWrt 通用架构**：\`openwrt-arm64\` / \`openwrt-amd64\` / \`openwrt-armv7\` / \`openwrt-mipsle\` + \`mochiledger-sync.init\`
          - **Cloudflare Workers + KV**：\`MochiLedger-SyncServer-${TAG}-cloudflare-worker.js\`
          - **Ktor + Docker 服务端**：\`MochiLedger-SyncServer-${TAG}-ktor.zip\`"
